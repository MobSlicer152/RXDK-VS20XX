name: Publish to VS Marketplace

# Publishes the extension to the Visual Studio Marketplace with VsixPublisher.exe.
#
# One-time setup (done by a maintainer, not this workflow):
#   1. Create a publisher at https://marketplace.visualstudio.com/manage and put its
#      ID in RxdkVs.Package/publishManifest.json ("publisher": "...").
#   2. Create an Azure DevOps Personal Access Token (https://dev.azure.com) with the
#      Marketplace ▸ Publish scope, and add it as the repo secret VS_MARKETPLACE_PAT
#      (Settings ▸ Secrets and variables ▸ Actions).
#   3. Bump <Identity Version> in source.extension.vsixmanifest before each publish —
#      the Marketplace rejects re-uploads of an existing version.
#
# Trigger: push a v* tag (e.g. v1.0.1), or run it manually from the Actions tab.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-marketplace
  cancel-in-progress: false

jobs:
  publish:
    name: Build + publish VSIX
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Engine (Rxdk.Cli + Rxdk.Dap) lives in the RXDK-Tools submodule; the VSIX bundles it.
          submodules: recursive

      # Ship the latest build engine in the published VSIX, not just the committed pin.
      - name: Update engine submodule to latest tools
        run: git submodule update --remote --recursive external/RXDK-Tools

      - name: Fail early if the Marketplace PAT is not configured
        env:
          VS_MARKETPLACE_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VS_MARKETPLACE_PAT)) {
            throw "Secret VS_MARKETPLACE_PAT is not set. Add an Azure DevOps PAT with the " +
                  "Marketplace > Publish scope (Settings > Secrets and variables > Actions)."
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # The VSIX build publishes the net8 engine (Rxdk.Cli + Rxdk.Dap) into tools\.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Stage project templates + scaffold
        run: ./scripts/dev.ps1 templates

      - name: Build VSIX (Release)
        run: >
          msbuild RxdkVs.Package/RxdkVs.Package.csproj
          -restore
          -nologo -v:minimal
          -p:Configuration=Release
          -p:DeployExtension=false

      - name: Locate the VSIX
        id: vsix
        run: |
          $ErrorActionPreference = 'Stop'
          $vsix = Get-ChildItem -Path RxdkVs.Package/bin/Release -Filter *.vsix -Recurse |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $vsix) { throw 'VSIX not found after build' }
          "path=$($vsix.FullName)" >> $env:GITHUB_OUTPUT

      - name: Locate VsixPublisher.exe
        id: publisher
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $ip = & $vswhere -latest -property installationPath
          $pub = Join-Path $ip 'VSSDK\VisualStudioIntegration\Tools\Bin\VsixPublisher.exe'
          if (-not (Test-Path $pub)) {
            $pub = Get-ChildItem -Path $ip -Recurse -Filter VsixPublisher.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $pub) { throw 'VsixPublisher.exe not found in the VS installation' }
          "path=$pub" >> $env:GITHUB_OUTPUT

      - name: Publish to Marketplace
        env:
          VS_MARKETPLACE_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
        run: |
          & "${{ steps.publisher.outputs.path }}" publish `
            -payload "${{ steps.vsix.outputs.path }}" `
            -publishManifest "RxdkVs.Package/publishManifest.json" `
            -personalAccessToken $env:VS_MARKETPLACE_PAT
